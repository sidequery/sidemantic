name: DuckDB Extension Release

on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        description: "Stable DuckDB release to package (v1.5.6); Cyanoptera is tested separately in CI"
        required: true
        default: "v1.5.6"
        type: string
      create_github_release:
        description: "Publish a new release; the matching extension version tag must already point to this commit"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "sidemantic-duckdb-v*"

  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/duckdb-extension-release.yml"

permissions:
  contents: read

env:
  GEN: ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CARGO_BUILD_JOBS: 2
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build ${{ matrix.platform }} extension package
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - platform: osx_amd64
            runner: macos-15-intel
          - platform: osx_arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: dnf install -y cmake ninja-build gcc gcc-c++ git make

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compilation
        if: github.event_name == 'pull_request'
        id: rust-cache
        uses: ./.github/actions/setup-rust-cache
        with:
          suffix: ${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index || 0 }}

      - name: Resolve DuckDB version
        id: duckdb
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.duckdb_version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="v1.5.6"
          fi

          # Publish stable artifacts only. CI separately tests the pinned PEG development build.
          if [ "$VERSION" != "v1.5.6" ]; then
            echo "Unsupported DuckDB version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch DuckDB dependencies
        working-directory: sidemantic-duckdb
        env:
          DUCKDB_VERSION: ${{ steps.duckdb.outputs.version }}
        run: make deps DUCKDB_VERSION="$DUCKDB_VERSION"

      - name: Build extension
        working-directory: sidemantic-duckdb
        env:
          DUCKDB_PLATFORM: ${{ matrix.platform }}
        run: make

      - name: Run extension tests
        working-directory: sidemantic-duckdb
        run: make test

      - name: Package extension artifact
        working-directory: sidemantic-duckdb
        env:
          DUCKDB_VERSION: ${{ steps.duckdb.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          DUCKDB_VERSION="${DUCKDB_VERSION#v}"
          ASSET="sidemantic-duckdb-${DUCKDB_VERSION}-${PLATFORM}.duckdb_extension"
          cp build/release/extension/sidemantic/sidemantic.duckdb_extension "dist/$ASSET"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidemantic-duckdb-extension-${{ matrix.platform }}
          path: sidemantic-duckdb/dist/*
          if-no-files-found: error

      - name: Save completed build caches
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/save-build-caches
        with:
          rust-key: ${{ steps.rust-cache.outputs.key }}

  github-release:
    name: Attach extension artifact to GitHub release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          pattern: sidemantic-duckdb-extension-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VERSION=$(grep '^version = ' sidemantic-rs/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
            TAG="sidemantic-duckdb-v${VERSION}"
          fi

          if [[ ! "$TAG" =~ ^sidemantic-duckdb-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid extension release tag" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify and publish immutable artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Checkout can create a lightweight local ref for an annotated tag.
          # Read the remote tag through FETCH_HEAD without replacing that ref.
          git fetch --no-tags origin "refs/tags/$TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$RELEASE_COMMIT" ]; then
            echo "Release tag does not identify the built commit" >&2
            exit 1
          fi
          cd dist
          for PLATFORM in linux_amd64 linux_arm64 osx_amd64 osx_arm64; do
            ASSET="sidemantic-duckdb-1.5.6-${PLATFORM}.duckdb_extension"
            test -s "$ASSET"
            sha256sum --check "$ASSET.sha256"
          done
          cat *.sha256 > SHA256SUMS
          cp ../LICENSE .
          # Creation fails if the tag already has a release; never overwrite published bytes.
          gh release create "$TAG" *.duckdb_extension SHA256SUMS LICENSE \
            --verify-tag --target "$RELEASE_COMMIT" --title "$TAG" --generate-notes
