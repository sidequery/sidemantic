name: DuckDB Extension Release

on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        description: "Stable DuckDB release to package (v1.5.6 or v2.0.1)"
        required: true
        default: "v1.5.6"
        type: string
      create_github_release:
        description: "Publish a new release; the matching extension version tag must already point to this commit"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "sqlctx-duckdb-v*"

  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/duckdb-extension-release.yml"

permissions:
  contents: read

env:
  GEN: ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CARGO_BUILD_JOBS: 2
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  versions:
    name: Select stable DuckDB releases
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.duckdb.outputs.versions }}
    steps:
      - name: Resolve DuckDB versions
        id: duckdb
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.duckdb_version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$REQUESTED_VERSION" in
              v1.5.6|v2.0.1) ;;
              *) echo "Unsupported DuckDB version" >&2; exit 1 ;;
            esac
            printf 'versions=["%s"]\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["v1.5.6","v2.0.1"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.duckdb_version }} ${{ matrix.platform }} extension package
    needs: versions
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        duckdb_version: ${{ fromJSON(needs.versions.outputs.versions) }}
        platform: [linux_amd64, linux_arm64, osx_amd64, osx_arm64]
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - platform: osx_amd64
            runner: macos-15-intel
          - platform: osx_arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: dnf install -y cmake ninja-build gcc gcc-c++ git make

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compilation
        if: github.event_name == 'pull_request'
        id: rust-cache
        uses: ./.github/actions/setup-rust-cache
        with:
          suffix: ${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index || 0 }}

      - name: Fetch DuckDB dependencies
        working-directory: sqlctx-duckdb
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb_version }}
        run: make deps DUCKDB_VERSION="$DUCKDB_VERSION"

      - name: Build extension
        working-directory: sqlctx-duckdb
        env:
          DUCKDB_PLATFORM: ${{ matrix.platform }}
        run: make

      - name: Run extension tests
        working-directory: sqlctx-duckdb
        env:
          SQLCTX_NATIVE_PEG: ${{ matrix.duckdb_version == 'v2.0.1' && '1' || '' }}
          EXPECTED_VERSION: ${{ matrix.duckdb_version }}
        run: |
          VERSION=$(./build/release/duckdb -unsigned -csv -noheader :memory: -c \
            "LOAD 'build/release/extension/sqlctx/sqlctx.duckdb_extension'; SELECT version();")
          test "$VERSION" = "$EXPECTED_VERSION"
          make test

      - name: Package extension artifact
        working-directory: sqlctx-duckdb
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          DUCKDB_VERSION="${DUCKDB_VERSION#v}"
          ASSET="sqlctx-duckdb-${DUCKDB_VERSION}-${PLATFORM}.duckdb_extension"
          cp build/release/extension/sqlctx/sqlctx.duckdb_extension "dist/$ASSET"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlctx-duckdb-extension-${{ matrix.duckdb_version }}-${{ matrix.platform }}
          path: sqlctx-duckdb/dist/*
          if-no-files-found: error

      - name: Save completed build caches
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/save-build-caches
        with:
          rust-key: ${{ steps.rust-cache.outputs.key }}

  github-release:
    name: Attach extension artifact to GitHub release
    needs: [versions, build]
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          pattern: sqlctx-duckdb-extension-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VERSION=$(grep '^version = ' sqlctx-rs/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
            TAG="sqlctx-duckdb-v${VERSION}"
          fi

          if [[ ! "$TAG" =~ ^sqlctx-duckdb-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid extension release tag" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify and publish immutable artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          DUCKDB_VERSIONS: ${{ join(fromJSON(needs.versions.outputs.versions), ' ') }}
        run: |
          set -euo pipefail
          # Checkout can create a lightweight local ref for an annotated tag.
          # Read the remote tag through FETCH_HEAD without replacing that ref.
          git fetch --no-tags origin "refs/tags/$TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$RELEASE_COMMIT" ]; then
            echo "Release tag does not identify the built commit" >&2
            exit 1
          fi
          cd dist
          for VERSION in $DUCKDB_VERSIONS; do
            for PLATFORM in linux_amd64 linux_arm64 osx_amd64 osx_arm64; do
              ASSET="sqlctx-duckdb-${VERSION#v}-${PLATFORM}.duckdb_extension"
              test -s "$ASSET"
              sha256sum --check "$ASSET.sha256"
            done
          done
          cat *.sha256 > SHA256SUMS
          cp ../LICENSE .
          # Creation fails if the tag already has a release; never overwrite published bytes.
          gh release create "$TAG" *.duckdb_extension SHA256SUMS LICENSE \
            --verify-tag --target "$RELEASE_COMMIT" --title "$TAG" --generate-notes
