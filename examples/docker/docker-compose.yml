services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: sidemantic_test
    ports:
      - "5433:5432"  # Use 5433 to avoid conflicts with local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    platform: linux/amd64
    ports:
      - "9050:9050"
    command: ["--project=test-project", "--dataset=test_dataset"]

  # Snowflake tests use fakesnow (Python library) for mocking, no Docker service needed
  # Databricks tests require real Databricks workspace - no emulator available

  spark:
    image: apache/spark:3.5.0
    platform: linux/amd64
    ports:
      - "10000:10000"  # Thrift server
      - "4040:4040"    # Spark UI
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-thriftserver.sh &&
      tail -f /opt/spark/logs/*
      "
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    platform: linux/amd64
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol (optional)
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Integration tests run on the host against these services; see README.md.

volumes:
  postgres_data:
