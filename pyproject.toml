[project]
name = "sqlctx"
version = "0.14.0"
description = "Universal semantic layer - import from Cube, dbt, LookML, Hex, and more"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "sqlglot>=30.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "duckdb>=1.4.4",
    "click>=8.0.0",
    "typer>=0.18.0",
]

[project.scripts]
sqlctx = "sqlctx.cli:app"

[project.optional-dependencies]
rust = [
    # PYODIDE: Native wheels are excluded from Emscripten installs.
    "sqlctx-rs==0.14.0; sys_platform != 'emscripten'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "playwright>=1.50.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23,<5",
    "pyarrow>=14.0.0",
    "uvicorn>=0.34.0",
    # fakesnow pinned out until it supports sqlglot 30.x
    # "fakesnow>=0.9.0",  # For Snowflake integration tests
    "lkml>=1.3.7",
    "inflect>=7.0.0",
    "antlr4-python3-runtime>=4.13.2",
    "sqlglot[c]>=30.1.0",
]
workbench = [
    "textual[syntax]>=1.0.0",
    "plotext>=5.3.2",
    "textual-plotext>=1.0.1",
    "lkml>=1.3.7",  # The bundled workbench demo includes LookML models.
]
mcp = [
    "mcp[cli]>=1.25.0,<2",
    "lkml>=1.3.7",  # The bundled --demo models include LookML.
]
apps = [
    "mcp[cli]>=1.25.0,<2",
    "altair>=5.0.0; python_version < '3.14'",
    "altair>=6.0.0; python_version >= '3.14'",
    "vl-convert-python>=1.0.0",
    "lkml>=1.3.7",  # The bundled --demo models include LookML.
]
charts = [
    "altair>=5.0.0; python_version < '3.14'",
    "altair>=6.0.0; python_version >= '3.14'",
    "vl-convert-python>=1.0.0",
]
fast = [
    "sqlglot[c]>=30.1.0",
]
ossie = [
    "jsonschema>=4.23,<5",
]
serve = [
    # riffq changes its handler API in minor releases; 0.4 is the tested series.
    "riffq>=0.4.1,<0.5",
    "pyarrow>=14.0.0",
    "lkml>=1.3.7",  # The bundled --demo models include LookML.
]
api = [
    "fastapi>=0.115.0",
    "pyarrow>=14.0.0",
    "uvicorn>=0.34.0",
    "lkml>=1.3.7",  # The bundled --demo models include LookML.
]
postgres = [
    "psycopg[binary]>=3.0.0",
    "pyarrow>=14.0.0",  # For Arrow support
]
bigquery = [
    "google-cloud-bigquery>=3.0.0",
    "pyarrow>=14.0.0",  # For Arrow support
]
snowflake = [
    "snowflake-connector-python>=3.0.0",
    "pyarrow>=14.0.0",  # For Arrow support
]
clickhouse = [
    "clickhouse-connect>=0.6.0",
    "pyarrow>=14.0.0",  # For Arrow support
]
databricks = [
    "databricks-sql-connector>=2.0.0",
    "pyarrow>=14.0.0",  # For Arrow support
]
spark = [
    "PyHive>=0.7.0",
    "thrift>=0.16.0",
    "thrift_sasl>=0.4.3",
    "pure-sasl>=0.6.2",  # Pure Python SASL for PyHive (no C deps)
    "pyarrow>=14.0.0",  # For Arrow support
]
adbc = [
    "adbc-driver-manager>=1.0.0",
    "pyarrow>=14.0.0", # For Arrow support
]
lsp = [
    "lsprotocol>=2025.0.0",
    "pygls>=2.0.0",
]
dax = [
    "sqlctx-dax>=0.14.0",
]
lookml = [
    "lkml>=1.3.7",
]
malloy = [
    "antlr4-python3-runtime>=4.13.2",
]
metricflow = [
    "inflect>=7.0.0",
]
widget = [
    "anywidget>=0.9.0",
    "pyarrow>=14.0.0",
]
# Convenience bundles
all-databases = [
    "sqlctx[postgres,bigquery,snowflake,clickhouse,databricks,spark,adbc]",
]
full = [
    "sqlctx[workbench,mcp,apps,charts,lsp,dax,lookml,malloy,metricflow,widget,api,ossie,rust]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.git",
  "/.github",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/crates/dax-pyo3/dist",
  "/crates/dax-pyo3/target",
  "/crates/dax-parser/target",
  "/dist",
  "/docs",
  "/tests",
  "/examples/__pycache__",
  "/examples/cube",
  "/examples/hex",
  "/examples/lookml",
  "/examples/metricflow",
  "/examples/omni",
  "/examples/rill",
  "/examples/sqlctx",
  "/examples/sql",
  "/examples/superset",
  "/sqlctx-duckdb",
  "/sqlctx-rs",
  "/plugins",
  "/target",
  "/vscode-sqlctx",
  "**/__pycache__",
  "*.pyc",
  "*.pkg",
  "test_*.py",
  "uv.lock",
]
# README.md is included via readme field in [project]
# examples/multi_format_demo is kept for demo mode

[tool.hatch.build.targets.wheel]
packages = ["sqlctx"]

[tool.hatch.build.targets.wheel.shared-data]
"sqlctx/man/sqlctx.1" = "share/man/man1/sqlctx.1"

[tool.hatch.build.targets.wheel.force-include]
"examples/multi_format_demo/cube" = "sqlctx/examples/multi_format_demo/cube"
"examples/multi_format_demo/hex" = "sqlctx/examples/multi_format_demo/hex"
"examples/multi_format_demo/lookml" = "sqlctx/examples/multi_format_demo/lookml"
"examples/multi_format_demo/demo_data.py" = "sqlctx/examples/multi_format_demo/demo_data.py"
"sqlctx/widget/static/widget.js" = "sqlctx/widget/static/widget.js"
"sqlctx/widget/static/widget.css" = "sqlctx/widget/static/widget.css"

[tool.ruff]
line-length = 120
target-version = "py311"
force-exclude = true
extend-exclude = [
    "sqlctx/adapters/malloy_grammar",  # ANTLR-generated files
    "sqlctx/adapters/holistics_grammar",  # ANTLR-generated files
    "tests/ossie-fixtures/upstream/**/validation/validate.py",  # Exact pinned Apache validator fixtures
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N807"]  # N807: dunder methods like __init__ are supposed to have __

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests requiring external services (deselect with '-m \"not integration\"')",
    "yardstick_upstream: opt-in tests that fetch and replay live upstream Yardstick SQL tests",
]
addopts = "-m 'not integration' --cov=sqlctx --cov-report=term-missing"  # Skip integration tests by default and show coverage

[tool.coverage.run]
source = ["sqlctx"]

[tool.mypy]
python_version = "3.11"
files = [
    "sqlctx/__init__.py",
    "sqlctx/core/dimension.py",
    "sqlctx/core/freshness.py",
    "sqlctx/core/metric.py",
    "sqlctx/core/model.py",
    "sqlctx/core/parameter.py",
    "sqlctx/core/pre_aggregation.py",
    "sqlctx/core/preagg_recommender.py",
    "sqlctx/core/query_plan.py",
    "sqlctx/core/registry.py",
    "sqlctx/core/relationship.py",
    "sqlctx/core/security.py",
    "sqlctx/core/segment.py",
    "sqlctx/core/semantic_graph.py",
    "sqlctx/core/semantic_layer.py",
]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.uv]
prerelease = "if-necessary"
# Require binary wheels for the CPython versions exercised by CI, without
# imposing a Python upper bound on users or requiring future/PyPy wheels.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and platform_python_implementation == 'CPython' and python_version < '3.15'",
]

[tool.uv.sources]
sqlctx-rs = { path = "sqlctx-rs" }
sqlctx-dax = { path = "crates/dax-pyo3" }

[dependency-groups]
dev = [
    "antlr4-python3-runtime>=4.13.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "inflect>=7.0.0",
    "jupyterlab>=4.5.1",
    "lkml>=1.3.7",
    "lsprotocol>=2025.0.0",
    "marimo==0.23.9",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "polars>=1.36.1",
    "playwright>=1.50.0",
    "pyarrow>=14.0.0",
    "pygls>=2.0.0",
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
    "uvicorn>=0.34.0",
]
