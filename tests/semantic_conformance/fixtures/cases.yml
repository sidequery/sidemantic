- name: keyless_aggregate
  source: native/keyless
  query:
    metrics:
    - keyless.revenue
  columns:
  - revenue
  rows:
  - - 30
- name: unknown_key_fanout
  source: native/keyless
  query:
    metrics:
    - keyless.revenue
    dimensions:
    - labels.label
  error:
    type: QueryValidationError
    match: no primary key
- name: cross_model_ratio
  source: native/orders
  query:
    metrics:
    - revenue_per_customer
  columns:
  - revenue_per_customer
  rows:
  - - 120.0
- name: local_customer_proxy_uses_customer_grain
  source: native/orders
  query:
    metrics: [orders.customer_proxy]
    filters: [orders.amount > 40]
  columns: [customer_proxy]
  rows: [[2]]
- name: graph_customer_proxy_uses_customer_grain
  source: native/orders
  query:
    metrics: [proxied_customers]
    filters: [orders.amount > 40]
  columns: [proxied_customers]
  rows: [[2]]
- name: grouped_customer_proxy_uses_customer_grain
  source: native/orders
  query:
    metrics: [proxied_customers]
    dimensions: [customers.region]
    filters: [orders.amount > 40]
    order_by: [customers.region]
  columns: [region, proxied_customers]
  rows: [[EU, 1], [US, 1]]
- name: restricted_rollup
  source: native/restricted
  query:
    metrics:
    - restricted.revenue
    user_attributes:
      tenant: 1
  columns:
  - revenue
  rows:
  - - 30
- name: restricted_rollup_requested
  source: native/restricted
  query:
    metrics: [restricted.revenue]
    user_attributes: {tenant: 1}
    use_preaggregations: true
  columns: [revenue]
  rows: [[30]]
- name: missing_security_context
  source: native/restricted
  query:
    metrics:
    - restricted.revenue
  error:
    type: SecurityError
    match: no user_attributes|security policy
- name: composite_null_foreign_key
  source: native/composite
  query:
    metrics:
    - shipments.shipment_count
    dimensions:
    - shipments.id
    - items.label
    order_by:
    - shipments.id
  columns:
  - id
  - label
  - shipment_count
  rows:
  - - 1
    - first
    - 1
  - - 2
    - second
    - 1
  - - 3
    - null
    - 1
  - - 4
    - other
    - 1
- name: sparse_month_comparison
  source: native/monthly
  query:
    metrics:
    - revenue_mom
    dimensions:
    - monthly.sale_date__month
    order_by:
    - monthly.sale_date__month
  columns:
  - sale_date__month
  - revenue
  - revenue_mom
  rows:
  - - '2024-01-01'
    - 100
    - null
  - - '2024-03-01'
    - 180
    - null
- name: computed_physical_collision
  source: native/collisions
  query:
    metrics:
    - collisions.raw_revenue
    dimensions:
    - collisions.amount
    order_by:
    - collisions.amount
  columns:
  - amount
  - raw_revenue
  rows:
  - - 20
    - 2
  - - 30
    - 3
- name: relationship_roles
  source: native/roles
  query:
    metrics:
    - flights.flight_count
    dimensions:
    - origin.city
    - destination.city
    order_by:
    - destination.city
  columns:
  - origin_city
  - destination_city
  - flight_count
  rows:
  - - SFO
    - JFK
    - 1
  - - SFO
    - LAX
    - 1
- name: cube_join
  source: cube
  query:
    metrics:
    - orders.revenue
    dimensions:
    - customers.region
    order_by:
    - customers.region
  columns:
  - region
  - revenue
  rows:
  - - EU
    - 90
  - - US
    - 150
- name: cube_filtered_measure
  source: cube
  query:
    metrics:
    - orders.large_revenue
  columns:
  - large_revenue
  rows:
  - - 100
- name: ossie_complete_aggregate
  source: ossie
  query: {metrics: [large_revenue]}
  columns: [large_revenue]
  rows: [[100]]
- name: empty_aggregate_null_fill
  source: native/null_fill
  query: {metrics: [collisions.empty_revenue]}
  columns: [empty_revenue]
  rows: [[0]]
- name: complete_aggregate_physical_filter
  source: native/complete_filter
  query: {metrics: [collisions.filtered_revenue]}
  columns: [filtered_revenue]
  rows: [[2]]
  rust_unsupported: [metric.complete_filters]
