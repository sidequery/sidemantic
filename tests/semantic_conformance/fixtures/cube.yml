cubes:
  - name: orders
    sql_table: orders
    dimensions:
      - {name: id, type: number, sql: id, primary_key: true}
      - {name: customer_id, type: number, sql: customer_id}
    measures:
      - {name: revenue, type: sum, sql: amount}
      - name: large_revenue
        type: sum
        sql: amount
        filters:
          - {sql: '${CUBE}.amount >= 100'}
    joins:
      - name: customers
        relationship: many_to_one
        sql: '${CUBE}.customer_id = ${customers.id}'
  - name: customers
    sql_table: customers
    dimensions:
      - {name: id, type: number, sql: id, primary_key: true}
      - {name: region, type: string, sql: region}
    measures:
      - {name: customer_count, type: count}
